<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Hemi · Hemanth Kumar Gopi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Hemi (Hemanth Kumar Gopi): professional cricketer and sports analyst. Athlete, analyst, builder. Boston, MA.">
<meta property="og:title" content="Hemi · Athlete. Analyst. Builder.">
<meta property="og:description" content="Professional cricketer building a career in sports analytics, machine learning and AI. Boston, MA.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image" content="https://hemanthkumargopi.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://hemanthkumargopi.vercel.app/">
<link rel="canonical" href="https://hemanthkumargopi.vercel.app/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one fixed particle "universe" canvas behind a tall scroll of scenes; the particles morph into each scene's subject as you scroll. Single deliberate dark theme. */
:root{--eo:cubic-bezier(0.23,1,0.32,1);--eio:cubic-bezier(0.77,0,0.175,1);
  --void:#12060F; --navy:#1E0A1A; --char:#2A0F24; --glass:rgba(32,10,28,.78);
  --line:rgba(255,170,170,.16); --text:#FFF3EA; --mute:#C99AA6; --ice:#FFE8DC;
  --cyan:#FF3D7F; --uv:#2EC4B6; --amber:#FFC857; --silver:#E6C3C0;
  --display:"Unbounded","Arial Black","Segoe UI",sans-serif;
  --body:"Manrope","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{background:var(--void);scroll-behavior:smooth}
body{background:var(--void);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.65;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.lock{overflow:hidden}
main,.top,.rail{transition:opacity .9s}
body.lock main,body.lock .top,body.lock .rail{opacity:0;pointer-events:none}
*{box-sizing:border-box}
a{color:var(--cyan)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:4px}
#universe{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block}
.nofx #universe{opacity:.0}
.nofx body,body.nofx{background:radial-gradient(ellipse at 70% 20%,#3A1230 0%,var(--void) 60%) fixed}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.cy{color:var(--cyan)}.am{color:var(--amber)}

/* cursor */
.cur{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;z-index:120;pointer-events:none;opacity:0;transition:opacity .3s}
.cur svg{display:block;width:100%;height:100%;overflow:visible;transition:scale .25s var(--eo)}
.cur::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:1.5px solid var(--gold,#FFC857);scale:.5;opacity:0;transition:scale .3s var(--eo),opacity .25s}
.cur i{position:absolute;inset:0;border-radius:50%;border:2px solid #FFC857;opacity:0;pointer-events:none}
.cur.hit i{animation:hit .5s var(--eo)}
@keyframes hit{0%{opacity:.9;scale:1}100%{opacity:0;scale:3.2}}
.cur.on{opacity:1}.cur.big svg{scale:1.3}.cur.big::before{scale:1;opacity:.9}.cur.down svg{scale:.82}
body.ballcur,body.ballcur a,body.ballcur button,body.ballcur [role=button],body.ballcur canvas,body.ballcur label,body.ballcur summary{cursor:none}
body.ballcur input,body.ballcur textarea{cursor:text}
@media (pointer:coarse){.cur{display:none}}
.nofx .cur{display:none}

/* top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(18,6,15,.9),rgba(18,6,15,0))}
.brand{font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.08em;color:var(--text);text-decoration:none}
.brand i{font-style:normal;color:var(--cyan)}
.top nav{display:flex;gap:20px}
.top nav a{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-decoration:none;padding:6px 0}
.top nav a:hover,.top nav a.on{color:var(--ice)}
.top nav a.on{box-shadow:0 1px 0 var(--cyan)}
.tools{display:flex;gap:8px}
.chipb{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;background:rgba(32,10,28,.7);border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;color:var(--ice);min-height:36px}
.chipb:hover{border-color:var(--cyan)}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--mute)}

/* rail + chapter nav */
.rail{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:35;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.rail button{background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:9px;padding:3px 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.rail span{opacity:0;transition:opacity .2s;white-space:nowrap}
.rail button:hover span,.rail button:focus-visible span{opacity:1}
.rail i{display:block;width:30px;height:2px;background:var(--mute);transform:scaleX(.53);transform-origin:left;transition:transform .2s var(--eo),background .2s}
.rail button.on i{transform:none;background:var(--cyan)}
.rail button.on{color:var(--ice)}
.chap{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;gap:6px;flex-wrap:wrap;opacity:0;pointer-events:none;transition:opacity .2s var(--eo);max-width:calc(100vw - 36px)}
.chap.show{opacity:1;pointer-events:auto}
.chap button{font-family:var(--mono);font-size:11px;letter-spacing:.1em;background:rgba(32,10,28,.8);border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer;color:var(--mute);min-height:34px}
.chap button.on{color:var(--void);background:var(--cyan);border-color:var(--cyan)}

/* scenes */
main{position:relative;z-index:2}
.sc{min-height:100vh;min-height:100svh;display:flex;align-items:center;max-width:1240px;margin:0 auto;padding-block:110px 90px;position:relative}
.sc.r{justify-content:flex-end}
.col{width:100%;max-width:560px;min-width:0;display:flex;flex-direction:column;gap:18px}
.sc.r .col{margin-right:60px}
.wide{width:100%;min-width:0;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-weight:700;font-size:clamp(28px,4.2vw,50px);line-height:1.08;text-transform:uppercase}
h3{font-weight:700;font-size:20px;line-height:1.2;text-transform:uppercase}
p{margin:0;color:#EFD3CF;max-width:62ch}
p strong{color:var(--text)}
.kick{display:flex;align-items:center;gap:10px}
.kick::before{content:"";width:28px;height:1px;background:var(--cyan)}
.quote{font-family:var(--display);font-weight:500;font-size:clamp(18px,2.2vw,24px);line-height:1.3;color:var(--ice);border-left:2px solid var(--cyan);padding-left:16px}
.rv{opacity:0;transform:translateY(14px);transition:opacity .6s var(--eo),transform .6s var(--eo)}
.rv.in{opacity:1;transform:none}
.rv:nth-child(2){transition-delay:50ms}.rv:nth-child(3){transition-delay:90ms}.rv:nth-child(4){transition-delay:125ms}.rv:nth-child(5){transition-delay:155ms}
.nofx .rv{opacity:1;transform:none;transition:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer;
  padding:15px 22px;border-radius:4px;border:1px solid var(--cyan);color:var(--void);background:var(--cyan);min-height:48px;position:relative;transition:box-shadow .25s,background .25s,transform .16s var(--eo)}
.btn:hover{box-shadow:0 0 34px rgba(255,61,127,.45)}
.btn.ghost{background:rgba(32,10,28,.55);color:var(--ice);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--cyan);box-shadow:0 0 26px rgba(255,61,127,.18)}
.row{display:flex;flex-wrap:wrap;gap:12px}

/* intro */
#intro{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;transition:opacity .9s}
#intro.out{opacity:0;pointer-events:none}
#intro .name{font-family:var(--display);font-weight:900;font-size:clamp(44px,12vw,150px);line-height:1;letter-spacing:.02em;text-shadow:0 0 50px rgba(255,61,127,.35)}
#intro .sub{font-family:var(--display);font-weight:500;font-size:clamp(15px,2.6vw,28px);letter-spacing:.32em;color:var(--cyan)}
#intro .say{font-size:clamp(16px,2vw,21px);color:var(--ice);max-width:30ch}
#intro .acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:18px}
.sp span{display:inline-block;opacity:0;transform:translateY(.5em);filter:blur(8px)}
.go .sp span{animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--d,0s) + var(--i)*45ms)}
.go .fade{animation:fade 1.1s ease forwards;animation-delay:var(--d,0s)}
.fade{opacity:0}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.pview.sw .pbody{animation:none}.screen video,.xp .more{transition:none}.sp span,.fade{opacity:1;transform:none;filter:none;animation:none!important}.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}

/* hero */
.hero .col{max-width:760px;gap:20px}
.hero h1{font-weight:900;font-size:clamp(34px,6.6vw,92px);line-height:.98;text-transform:uppercase}
.hero h1.hemi{font-size:clamp(72px,13vw,176px);letter-spacing:-.01em;line-height:.9}
.fullname{margin-top:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--silver);font-size:13px}
.tri{font-family:var(--display);font-weight:700;font-size:clamp(20px,3vw,36px);line-height:1.15;display:flex;flex-wrap:wrap;gap:0 18px}
.tri span:nth-child(1){color:var(--amber)}.tri span:nth-child(2){color:var(--cyan)}.tri span:nth-child(3){color:var(--ice)}
.hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;max-width:760px}
.hud div{background:rgba(24,8,20,.82);padding:12px 14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ice);min-width:0}
.hud small{display:block;color:var(--mute);font-size:10px;margin-bottom:4px}

/* panels */
.panel{background:var(--glass);border:1px solid var(--line);border-radius:10px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.chn{font-family:var(--display);font-weight:900;font-size:clamp(60px,10vw,130px);line-height:.8;color:transparent;-webkit-text-stroke:1px rgba(255,170,170,.35)}

/* experience */
.spine{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:34px}
.spine::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:1px;background:linear-gradient(var(--cyan),var(--uv),transparent)}
.xgrp{color:var(--cyan);letter-spacing:.16em;text-transform:uppercase;font-size:12px;margin:14px 0 -4px}.xgrp:first-child{margin-top:0}
.xp{position:relative;padding:18px 20px;cursor:pointer;text-align:left;width:100%;display:flex;flex-direction:column;gap:6px;transition:border-color .25s}
.xp::before{content:"";position:absolute;left:-30px;top:24px;width:11px;height:11px;border-radius:50%;border:2px solid var(--cyan);background:var(--void);transition:background .25s,box-shadow .25s}
.xp[aria-expanded="true"]{border-color:rgba(255,61,127,.55)}
@media (hover:hover) and (pointer:fine){.xp:hover{border-color:rgba(255,61,127,.55)}}
.xp:hover::before,.xp[aria-expanded="true"]::before{background:var(--cyan);box-shadow:0 0 16px var(--cyan)}
.xp .hd{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;align-items:baseline}
.xp .org{color:var(--cyan);font-weight:700;font-size:15px}
.tagp{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:3px 9px;white-space:nowrap}
.tagp.done{color:var(--silver)}.tagp.now{color:var(--cyan)}.tagp.next{color:var(--amber)}
.xp .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--eo)}
.xp .more>div{overflow:hidden}
.xp[aria-expanded="true"] .more{grid-template-rows:1fr}
@media (hover:hover) and (pointer:fine){.xp:hover .more{grid-template-rows:1fr}}
.xp ul{margin:8px 0 0;padding-left:18px;color:#EFD3CF;font-size:15.5px}
.xp p{font-size:16px}

/* projects */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button[aria-pressed="true"]{background:var(--cyan);color:var(--void);border-color:var(--cyan)}
.mgrid{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:16px;align-items:start}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist button{width:100%;text-align:left;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;transition:border-color .2s,background .2s}
.plist button .n{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.1em}
.plist button .t{font-family:var(--display);font-weight:700;font-size:13.5px;text-transform:uppercase;line-height:1.25}
.plist button .s{grid-column:2;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.plist button[aria-selected="true"]{border-color:var(--cyan);background:rgba(255,61,127,.09)}
.plist button[aria-selected="true"] .n{color:var(--cyan)}
.pview{overflow:hidden;min-width:0}
.holo{position:relative;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,61,127,.05),transparent)}
.holo canvas{display:block;width:100%;aspect-ratio:16/8;max-width:100%;touch-action:pan-y}
.holo .lab{position:absolute;left:12px;top:10px}
.pbody{padding:20px 22px 24px;display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 16px;margin:0;font-size:15.5px}
.facts dt{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);padding-top:4px}
.facts dd{margin:0;color:#EFD3CF}
.note{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--amber);border:1px dashed rgba(255,200,87,.5);border-radius:6px;padding:8px 10px;line-height:1.5}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 18px}
.ctl label{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.ctl label b{color:var(--ice);font-weight:500}
input[type=range]{width:100%;accent-color:var(--cyan);height:28px}

/* lab */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button[aria-selected="true"]{background:var(--cyan);color:var(--void);border-color:var(--cyan)}
.labgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0}
.labgrid canvas{display:block;width:100%;aspect-ratio:5/4;max-width:100%;touch-action:pan-y}
.labside{padding:20px 22px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:14px;min-width:0}
.big{font-family:var(--display);font-weight:900;font-size:clamp(34px,5vw,56px);line-height:1;color:var(--cyan);font-variant-numeric:tabular-nums}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats3 div{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.stats3 b{display:block;font-size:18px;color:var(--ice);font-weight:500;font-variant-numeric:tabular-nums}

/* skills */
.skmap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px clamp(60px,16vw,260px);padding:22px}
.skmap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.skmap path{fill:none;stroke:rgba(255,170,170,.13);stroke-width:1;transition:stroke .3s,stroke-width .3s}
.skmap path.hot{stroke:var(--cyan);stroke-width:1.8;stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.skcol{display:flex;flex-direction:column;gap:8px;position:relative;z-index:1;min-width:0}
.sk,.pj{cursor:pointer;padding:9px 12px;border-radius:6px;border:1px solid var(--line);background:rgba(24,8,20,.85);text-align:left;font-size:14.5px;line-height:1.3;min-height:40px;transition:border-color .2s,background .2s}
.sk.x{border-style:dashed;color:var(--silver)}
.sk[aria-pressed="true"],.pj.hot{border-color:var(--cyan);background:rgba(255,61,127,.1)}
.pj{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px}
.legend span::before{content:"";display:inline-block;width:18px;height:10px;border:1px solid var(--ice);border-radius:3px;margin-right:8px;vertical-align:-1px}
.legend span.x::before{border-style:dashed}

/* interests */
.ints{display:flex;flex-wrap:wrap;gap:8px}
.ints button[aria-pressed="true"]{background:var(--amber);color:var(--void);border-color:var(--amber)}
.intx{min-height:9.5em}

/* contact */
.mail{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mail code{font-family:var(--mono);font-size:15px;padding:13px 14px;border:1px solid var(--line);border-radius:4px;background:rgba(32,10,28,.7);user-select:all;overflow-wrap:anywhere;min-width:0}
.lk{font-family:var(--display);font-weight:700;font-size:clamp(18px,2.4vw,26px);text-transform:uppercase;text-decoration:none;color:var(--ice);background:linear-gradient(var(--cyan),var(--cyan)) 0 100%/0 2px no-repeat;transition:background-size .35s;padding-bottom:4px}
.lk:hover{background-size:100% 2px}
footer{position:relative;z-index:2;text-align:center;padding-block:24px 44px}

/* dialogs */
.veil{position:fixed;inset:0;z-index:100;background:rgba(10,3,8,.72);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dlg{width:100%;max-width:560px;max-height:76vh;overflow:auto;padding:18px}
.dlg input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);font:500 18px var(--body);padding:10px 4px 12px;outline:none}
.dlg ul{list-style:none;margin:10px 0 0;padding:0}
.dlg li button{width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:11px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;font-size:16px;min-height:44px}
.dlg li button.act,.dlg li button:hover{background:rgba(255,61,127,.12)}
.brief{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;align-items:start}
.mono-av{width:72px;height:72px;border-radius:8px;border:1px solid var(--cyan);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:22px;color:var(--cyan);object-fit:cover}
.brief dl{margin:0;display:grid;gap:10px;font-size:15.5px}
.brief dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
.brief dd{margin:0;color:#EFD3CF}

/* pro polish: progress line, engine readout, engineering grid */
#prog{position:fixed;left:0;top:0;height:2px;width:100%;z-index:45;background:linear-gradient(90deg,var(--cyan),var(--uv));transform-origin:0 50%;transform:scaleX(0)}
#ehud{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:34;font-size:10px;letter-spacing:.12em;color:var(--mute);text-align:right;pointer-events:none;font-variant-numeric:tabular-nums}
#ehud b{color:var(--cyan);font-weight:500}

const dead={};function guard(k,fn,host){if(dead[k])return;try{fn()}catch(e){dead[k]=1;console.error('[btg] '+k,e);track('error',{module:k});if(host)host.insertAdjacentHTML('beforeend','<p class="note">This visual could not render on this device. The text content is unaffected.</p>')}}
let hudShape='',fpsE=60,lastF=0,lastHud=0;

function loop(now){hud(now);
  const rec=document.body.classList.contains('rec');

  if(vis.lab&&!rec)guard('lab-'+labTab,()=>drawLab(now),labS);
  requestAnimationFrame(loop)}
